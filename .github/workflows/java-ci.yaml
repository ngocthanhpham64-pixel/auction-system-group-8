name: Online Auction System CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 # Bước 1: Lấy code từ GitHub về máy ảo

    - name: Set up JDK 17
      uses: actions/setup-java@v4 # Bước 2: Cài đặt Java 17
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Verify Code Style and Run Tests
      # Dùng 'verify' để kích hoạt cả Checkstyle (đã cài ở pom.xml) và JUnit Test
      run: xvfb-run mvn clean verify 

    - name: Package Application
      # Nếu bước Verify thành công, tiến hành đóng gói file .jar
      run: mvn package -DskipTests 

    - name: Upload Build Artifact
      # Lưu file .jar lại để giảng viên hoặc nhóm có thể tải về chạy thử
      uses: actions/upload-artifact@v4
      with:
        name: auction-system-binary
        path: "*/target/*.jar"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: auctiva-executable-jar
        path: |
          **/target/*.jar